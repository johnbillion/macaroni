[package]
name = "Macaroni"
version = "0.5.0"
description = "HackerOne desktop client"
authors = ["John Blackbourn"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "macaroni_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json", "http2"] }
thiserror = "2.0.18"
anyhow = "1.0.102"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
keyring = { version = "3", features = ["apple-native"] }
async-trait = "0.1.89"
log = "0.4"
base64 = "0.22.1"
serde_urlencoded = "0.7.1"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher", "functions"] }
getrandom = "0.3"
libc = "0.2"
shlex = "1.3"
zeroize = { version = "1.8", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
# Read NSColor.controlAccentColor to surface the system accent colour to the UI. Versions
# match what Tauri/wry already pull in, so this adds no new compiled crates.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSString", "NSOperation"] }
objc2-app-kit = { version = "0.3", features = ["NSColor", "NSColorSpace"] }
block2 = "0.6"

